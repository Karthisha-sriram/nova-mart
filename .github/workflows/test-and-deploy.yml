name: NOVA MART CI/CD & Automated QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '8.0.x'
  PORT: 3000
  BASE_URL: 'http://localhost:3000'
  BROWSER: 'Chrome'
  HEADLESS: 'true'

jobs:
  # =========================================================================
  # JOB 1: Build & Automated Selenium Regression Testing
  # =========================================================================
  build-and-test:
    name: Build & Automated QA Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Lint Codebase
        run: npm run lint

      - name: 5. Build Full-Stack Application
        run: npm run build

      - name: 6. Start Application Background Service
        run: |
          npm start &
          echo "APPLICATION_PID=$!" >> $GITHUB_ENV

      - name: 7. Health Check Verification
        run: |
          echo "Waiting for NOVA MART server to report healthy status on port 3000..."
          timeout 30 bash -c 'until curl -sf http://localhost:3000/api/health; do sleep 1; done'
          echo "NOVA MART is responsive and serving requests."

      - name: 8. Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 9. Set up Headless Google Chrome & Driver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 10. Restore C# Dependencies
       run: dotnet restore automation/NOVAMart.Automation.csproj

      - name: 11. Run C# Selenium Automated Regression Tests
        id: run_tests
        run: |
          dotnet test automation/NOVAMart.Automation.csproj \
            --configuration Release \
            --logger "trx;LogFileName=TestResults.trx" \
            --logger "console;verbosity=normal"
        env:
          BASE_URL: ${{ env.BASE_URL }}
          BROWSER: ${{ env.BROWSER }}
          HEADLESS: ${{ env.HEADLESS }}

      - name: 12. Upload Test Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-execution-reports
          path: |
            automation/Reports/
            automation/TestResults/
          retention-days: 14

      - name: 13. Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-failure-screenshots
          path: automation/Screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: 14. Terminate Background Server
        if: always()
        run: |
          if [ -n "$APPLICATION_PID" ]; then
            kill $APPLICATION_PID || true
          fi

  # =========================================================================
  # JOB 2: Cloud Deployment to Azure (Gated by Passing Tests)
  # =========================================================================
  deploy-to-azure:
    name: Deploy to Azure Cloud
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 3. Install Dependencies & Build
        run: |
          npm ci
          npm run build

      # Step 4: Deploy Frontend to Azure Static Web Apps
      - name: 4. Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"
        continue-on-error: true # Allows graceful demo runs if tokens are awaiting Azure provisioning

      # Step 5: Deploy Backend to Azure App Service
      - name: 5. Log in to Azure CLI
        uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true

      - name: 6. Deploy Backend to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'novamart-api-prod'
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: '.'
        continue-on-error: true
