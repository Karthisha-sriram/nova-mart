name: NOVA MART CI/CD & Automated Regression Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-lint:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Test Dependencies
        run: |
          cd playwright-tests
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Static Code Analysis & Linting
        run: npm run lint

      - name: Build Full-Stack Distribution Artifacts
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start Application Server
        run: |
          npm start &
          sleep 5
          curl -I http://localhost:3000/api/health

      - name: Run Playwright Tests
        run: |
          cd playwright-tests
          npm test

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-report
          path: playwright-tests/playwright-report/
          if-no-files-found: ignore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novamart-dist
          path: dist/

  automated-selenium-tests:
    name: Selenium WebDriver & Regression Test Suite
    needs: build-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js & Start Local Server
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Run Server in Background
        run: |
          npm ci
          npm run build
          npm run start &
          sleep 4
          curl -I http://localhost:3000/api/health

      - name: Execute C# NUnit Selenium Suite
        run: |
          dotnet restore automation/NOVAMart.Automation.csproj
          dotnet test automation/NOVAMart.Automation.csproj --logger "trx;LogFileName=test_results.trx" --verbosity normal

      - name: Publish Test Results Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-results
          path: automation/**/test_results.trx

  deploy-to-azure:
    name: Deploy to Microsoft Azure
    needs: [build-and-lint, automated-selenium-tests]
    runs-on: ubuntu-latest
    if: false  # Disabled until Azure secrets are configured

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: novamart-dist
          path: dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"

  deploy-to-aws:
    name: Deploy to AWS (S3 & App Runner)
    needs: [build-and-lint, automated-selenium-tests]
    runs-on: ubuntu-latest
    if: false  # Disabled until AWS secrets are configured
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync Frontend to AWS S3 & Invalidate CloudFront
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"